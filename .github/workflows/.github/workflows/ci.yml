name: CI Workflow

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Verify Application Files
        run: |
          ls -la
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All application files are present and verified!"
